name: ShiftNote

options:
  bundleIdPrefix: app.shiftnote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ja

targets:
  ShiftNote:
    type: application
    platform: iOS
    sources:
      - path: ShiftNote
        excludes:
          - "**/*.entitlements"
      - path: Shared
    dependencies:
      - target: ShiftNoteWidget
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ShiftNote/ShiftNote.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ShiftNote/Info.plist
      properties:
        CFBundleDisplayName: Shift Note
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: カレンダーにある「シフト」の予定から、給与・勤務時間・年収を計算します。ウィジェット用の設定を保存する以外に、予定を書き換えることはありません。
        NSCalendarsUsageDescription: カレンダーにある「シフト」の予定から、給与・勤務時間・年収を計算します。
        CFBundleURLTypes:
          - CFBundleURLName: app.shiftnote.open
            CFBundleURLSchemes:
              - shiftnote

  ShiftNoteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ShiftNoteWidget
        excludes:
          - "**/*.entitlements"
      - path: Shared
    configFiles:
      Debug: Config/Widget.xcconfig
      Release: Config/Widget.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ShiftNoteWidget/ShiftNoteWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShiftNoteWidget/Info.plist
      properties:
        CFBundleDisplayName: Shift Note
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSCalendarsFullAccessUsageDescription: カレンダーにある「シフト」の予定から、給与・勤務時間・年収を計算します。

  ShiftNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShiftNoteTests
    dependencies:
      - target: ShiftNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ShiftNote:
    build:
      targets:
        ShiftNote: all
        ShiftNoteWidget: all
    test:
      targets:
        - ShiftNoteTests
