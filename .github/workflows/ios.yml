name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          set -o pipefail
          xcodebuild test \
            -project ShiftNote.xcodeproj \
            -scheme ShiftNote \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test.log" | xcbeautify --renderer github-actions || {
            grep -E "error:|Test Case .* failed|XCTAssert" "$RUNNER_TEMP/test.log" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      # 署名なしの .ipa（いつもの署名ツールで署名してインストールする）
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project ShiftNote.xcodeproj \
            -scheme ShiftNote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/unsigned.log" | xcbeautify --renderer github-actions || {
            grep -E "error:" "$RUNNER_TEMP/unsigned.log" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/unsigned/Payload" "$RUNNER_TEMP/ipa-unsigned"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/ShiftNote.app" "$RUNNER_TEMP/unsigned/Payload/"
          ls "$RUNNER_TEMP/unsigned/Payload/ShiftNote.app/PlugIns"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "$RUNNER_TEMP/ipa-unsigned/ShiftNote-unsigned-${{ github.run_number }}.ipa" Payload)

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/ipa-unsigned/ShiftNote-unsigned-${{ github.run_number }}.ipa
          archive: false
          retention-days: 14
